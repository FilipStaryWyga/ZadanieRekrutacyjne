services:
  postgres:
    image: postgres:16-alpine
    container_name: notatnik-postgres
    environment:
      POSTGRES_USER: notatnik
      POSTGRES_PASSWORD: notatnik
      POSTGRES_DB: notatnik
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notatnik -d notatnik"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: notatnik-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: notatnik
      MINIO_ROOT_PASSWORD: notatniksecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
    container_name: notatnik-server
    environment:
      DATABASE_URL: postgres://notatnik:notatnik@postgres:5432/notatnik
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: notatnik
      MINIO_SECRET_KEY: notatniksecret
      MINIO_BUCKET: notatnik-media
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CORS_ORIGIN: "*"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
